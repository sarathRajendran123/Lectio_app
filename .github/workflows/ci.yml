# Written 2026-11-13. This workflow has never run: it was authored without access to GitHub Actions.
# Expect to adjust it on the first run. The PostgreSQL job is allowed to fail until that has been done.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (SQLite, test mode, no model downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-local.txt
      - run: python -m compileall -q backend frontend scripts
      - run: python -m pytest -q
        env:
          LECTIO_SKIP_MODEL_TESTS: "1"

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit==2.7.3
      - run: pip-audit -r requirements-core.txt -r requirements-frontend.txt
      - name: No environment file or provider key in tracked files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is tracked"; exit 1; fi
          if git grep -nE 'sk-or-v1-[A-Za-z0-9]{20,}' -- . ':!.github'; then echo "::error::provider key in a tracked file"; exit 1; fi

  postgres:
    name: Tests on PostgreSQL (not yet verified)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lectio_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lectio_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lectio_user -d lectio_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-local.txt asyncpg==0.30.0 "psycopg[binary]"
      - name: Whole suite against PostgreSQL
        run: python -m pytest -q
        env:
          LECTIO_SKIP_MODEL_TESTS: "1"
          LECTIO_TEST_DATABASE_URL: postgresql+asyncpg://lectio_user:ci-only-password@127.0.0.1:5432/lectio_db

  browser:
    name: Browser check of the pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/setup_local.py
      - name: Browser check (the script starts its own API and UI on ports 8011 and 8511)
        run: |
          mkdir -p data
          python scripts/check_browser.py
